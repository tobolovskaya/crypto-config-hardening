# Виправлена конфігурація - crypto_config_mi.yaml
# Покращено параметри Argon2 та виправлено fixed_iv для GCM

jwt:
  algorithm: RS256                    # Асиметричний алгоритм
  key_size: 2048                      # Достатній розмір (можна 4096 для критичних систем)
  verify_signature: true              # Перевіряємо підпис
  claims:
    exp_required: true                # Додано обов'язкові перевірки
    exp_max_time: 900                 # 15 хвилин
    iat_required: true                # Issued at
    aud_check: true                   # Audience check
    aud_value: "${APP_AUDIENCE}"
    iss_check: true                   # Issuer check
    iss_value: "${AUTH_SERVER}"
    nbf_check: true                   # Not before
  private_key_storage: hsm            # Hardware Security Module
  public_key_distribution: jwks       # JSON Web Key Set endpoint

passwords:
  hash_function: argon2id             # Найкращий алгоритм (hybrid Argon2)
  time_cost: 2                        # Збільшено з 1 до 2 (мінімум)
  memory_cost: 19456                  # Збільшено з 1024 до 19456 KiB (19 MiB)
  parallelism: 1                      # Залишено (залежить від сервера)
  hash_length: 32                     # 32 байти вихідний хеш
  salt_length: 16                     # 16 байт випадкової солі
  salt_strategy: random_per_password  # Унікальна для кожного

encryption:
  algorithm: AES-256-GCM              # Authenticated encryption
  key_length: 256                     # 256 біт
  iv_strategy: crypto_random_nonce    # ВИПРАВЛЕНО: випадковий nonce
  nonce_length: 96                    # 96 біт (12 байт) для GCM
  nonce_generation: csprng            # Криптографічно стійкий генератор
  key_storage: hsm                    # Hardware Security Module
  key_derivation: pbkdf2              # Для генерації ключів з паролів
  kdf_iterations: 100000              # 100k ітерацій для PBKDF2
  authenticated_data: true            # Додаткові автентифіковані дані (AAD)
  tag_length: 128                     # 128 біт authentication tag

# Додаткові налаштування безпеки
security:
  tls_version: "1.3"                  # Мінімальна версія TLS
  hsts_enabled: true                  # HTTP Strict Transport Security
  certificate_pinning: true           # Для критичних з'єднань
  secrets_rotation: enabled
  secrets_rotation_days: 90
  audit_logging: enabled              # Логування всіх криптооперацій
