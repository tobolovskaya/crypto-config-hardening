# Виправлена конфігурація - crypto_config_we.yaml
# Всі критичні помилки виправлені

jwt:
  algorithm: RS256                    # Використовуємо асиметричний алгоритм
  key_size: 2048                      # Достатній розмір ключа
  verify_signature: true              # Завжди перевіряємо підпис
  claims:
    exp_required: true                # Вимагаємо термін дії
    exp_max_time: 900                 # 15 хвилин (900 секунд)
    aud_check: true                   # Перевіряємо audience
    aud_value: "${APP_AUDIENCE}"      # З змінної оточення
    iss_check: true                   # Перевіряємо issuer
    iss_value: "${AUTH_SERVER}"       # З змінної оточення
    nbf_check: true                   # Перевіряємо not-before

passwords:
  hash_function: argon2id             # Найсучасніший алгоритм
  time_cost: 2                        # Мінімум 2 ітерації
  memory_cost: 19456                  # 19 MiB (19456 KiB)
  parallelism: 1                      # Паралельні потоки
  salt_strategy: random_per_password  # Унікальна сіль для кожного пароля

encryption:
  algorithm: AES-256-GCM              # Authenticated encryption
  key_length: 256                     # 256 біт для максимальної безпеки
  iv_strategy: random_nonce           # Випадковий nonce для кожної операції
  nonce_length: 96                    # 96 біт (12 байт) для GCM
  key_storage: env_variable           # З змінної оточення
  key_rotation: enabled               # Підтримка ротації ключів
  key_rotation_days: 90               # Ротація кожні 90 днів
