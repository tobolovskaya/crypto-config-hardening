#########################################################################
# YAML-конфігурація мікросервісу зберігання медичних записів (EHR)
#########################################################################
# Дата: Грудень 2025
# Призначення: Безпечне зберігання та обробка медичних даних
# Compliance: HIPAA, GDPR, PCI DSS, SOC 2
# Рівень безпеки: CRITICAL (медичні дані)
#########################################################################

service:
  name: "medical-records-microservice"
  version: "2.0.0"
  environment: "production"
  description: "Сервіс зберігання електронних медичних записів з криптозахистом"
  
  # Обробляємо високочутливі дані (PHI/PII)
  data_classification: "tier-1-critical"
  compliance_requirements:
    - "HIPAA"      # Health Insurance Portability and Accountability Act
    - "GDPR"       # General Data Protection Regulation
    - "PCI-DSS"    # Payment Card Industry Data Security Standard
    - "SOC2"       # Service Organization Control 2

#########################################################################
# 1. JWT Authentication (JSON Web Tokens)
#########################################################################
# Для автентифікації лікарів, медсестер, пацієнтів
# STRIDE захист: S (Spoofing), E (Elevation of Privilege)
#########################################################################

jwt:
  # RS256 - асиметричне шифрування (публічний/приватний ключ)
  # Чому RS256, а не HS256:
  # - Приватний ключ тільки на auth сервері
  # - Мікросервіси перевіряють через публічний ключ
  # - Неможливо підробити токен без приватного ключа
  # - Краще для мікросервісної архітектури
  algorithm: "RS256"
  
  # 3072-біт для медичних систем (вище стандартних 2048)
  # Причина: критичність медичних даних + довгострокове зберігання
  # Стійкість: ~128-біт post-quantum security
  key_size: 3072
  
  # Публічний ключ розподіляється через JWKS (JSON Web Key Set)
  # URL для отримання публічних ключів мікросервісами
  # Автоматичне оновлення при ротації ключів
  jwks_url: "https://auth.medical.internal/.well-known/jwks.json"
  
  # Issuer - хто видав токен (auth сервер)
  # Мікросервіси перевіряють, що токен від довіреного issuer
  issuer: "https://auth.medical.internal"
  
  # Audience - для кого призначений токен
  # Токен валідний тільки для цих сервісів
  audience:
    - "medical-records-api"
    - "prescription-service"
    - "lab-results-service"
    - "patient-portal"
  
  access_token:
    # 15 хвилин - короткий термін для безпеки
    # Чому так мало: якщо токен викрадено, працює тільки 15 хв
    # Для медичних даних це критично важливо
    expiration_seconds: 900
    
    # Claims (дані) у токені
    claims:
      # Стандартні claims (RFC 7519)
      - "iss"        # Issuer (хто видав)
      - "sub"        # Subject (user ID)
      - "aud"        # Audience (для кого)
      - "exp"        # Expiration (коли закінчується)
      - "iat"        # Issued At (коли видано)
      - "nbf"        # Not Before (не валідний до цього часу)
      - "jti"        # JWT ID (унікальний ідентифікатор)
      
      # Custom claims для медичного сервісу
      - "role"       # Роль: doctor, nurse, patient, admin
      - "license_id" # Номер медичної ліцензії (для лікарів)
      - "department" # Відділення (cardiology, surgery, etc.)
      - "permissions" # Fine-grained permissions (read:diagnosis, write:prescription)
      - "mfa_verified" # Чи пройдено MFA
      - "session_id" # ID сесії для відкликання
  
  refresh_token:
    # 7 днів - для оновлення access токену
    # Зберігається в httpOnly cookie (захист від XSS)
    expiration_seconds: 604800
    
    # Rotation - кожен раз генерується новий refresh token
    # Старий invalidується (захист від replay attacks)
    rotation_enabled: true
    
    # Зберігання у базі для можливості відкликання
    storage: "redis"
    storage_ttl: 604800
  
  # Валідація токену
  validation:
    # Перевіряти підпис (критично!)
    verify_signature: true
    
    # Перевіряти expiration
    verify_expiration: true
    
    # Перевіряти issuer
    verify_issuer: true
    
    # Перевіряти audience
    verify_audience: true
    
    # Tolerance для clock skew між серверами
    clock_skew_seconds: 60
    
    # Чорний список відкликаних токенів (logout, security breach)
    revocation_check: true
    revocation_storage: "redis"

#########################################################################
# 2. Password Hashing
#########################################################################
# Для паролів лікарів, медсестер, пацієнтів, адміністраторів
# STRIDE захист: S (Spoofing)
#########################################################################

password_hashing:
  # Argon2id - найсучасніший алгоритм (переможець PHC 2015)
  # Hybrid: Argon2i (side-channel resistant) + Argon2d (GPU resistant)
  # RFC 9106, рекомендовано OWASP, NIST
  algorithm: "argon2id"
  
  # Time cost = 3 (більше ніж базовий 2)
  # Причина: медичні системи = критична безпека
  # Компроміс: ~500ms per hash (прийнятно для login)
  time_cost: 3
  
  # Memory cost = 64 MiB (вище базових 19 MiB)
  # Причина: захист від GPU/ASIC атак
  # 64 MiB робить brute-force економічно невигідним
  memory_cost_kib: 65536
  
  # Parallelism = 4 потоки
  # Використання багатоядерних процесорів
  parallelism: 4
  
  # Hash length = 32 байти (256 біт)
  # Достатньо для криптографічної стійкості
  hash_length: 32
  
  # Salt length = 16 байт (128 біт)
  # ОБОВ'ЯЗКОВО: унікальна випадкова сіль для КОЖНОГО пароля
  # Захист від rainbow tables та parallel cracking
  salt_length: 16
  salt_source: "crypto_random"  # Криптографічно стійкий генератор
  
  # Pepper - додатковий секрет (НЕ зберігається в БД!)
  # Зберігається в HSM/KMS
  # Навіть при витоку БД, без pepper неможливо зламати
  pepper_enabled: true
  pepper_source: "aws-secrets-manager"
  pepper_path: "medical/password-pepper"
  pepper_rotation_days: 180
  
  # Password policy
  password_requirements:
    min_length: 12           # Мінімум 12 символів
    require_uppercase: true
    require_lowercase: true
    require_digits: true
    require_special: true
    
    # Перевірка на компрометовані паролі (HIBP API)
    check_breached_passwords: true
    
    # Історія паролів (не повторювати останні 5)
    password_history: 5
    
    # Термін дії пароля
    expiration_days: 90
    
    # MFA requirement для sensitive roles
    mfa_required_roles:
      - "doctor"
      - "admin"
      - "pharmacist"

#########################################################################
# 3. Data Encryption (at rest)
#########################################################################
# Шифрування медичних записів, діагнозів, персональних даних
# STRIDE захист: I (Information Disclosure), T (Tampering)
#########################################################################

encryption_at_rest:
  # AES-256-GCM - Advanced Encryption Standard, Galois/Counter Mode
  # Чому GCM:
  # - AEAD (Authenticated Encryption with Associated Data)
  # - Одночасно: конфіденційність + автентичність + цілісність
  # - NIST затверджений, HIPAA compliant
  # - Апаратна підтримка (AES-NI) = швидко
  algorithm: "AES-256-GCM"
  
  key_length: 256           # 256 біт (post-quantum resistant)
  nonce_length: 96          # 12 байт для GCM (стандарт)
  tag_length: 128           # 16 байт authentication tag
  
  # КРИТИЧНО: ВИПАДКОВИЙ nonce для КОЖНОЇ операції шифрування!
  # Fixed nonce з GCM = повна компрометація ключа!
  nonce_generation: "crypto_random"
  nonce_reuse_check: true   # Fail-safe перевірка
  
  # Envelope Encryption (двошарове шифрування)
  # Схема:
  # 1. Data Encryption Key (DEK) - шифрує дані (швидкий AES)
  # 2. Key Encryption Key (KEK) - шифрує DEK (зберігається в KMS/HSM)
  # Переваги: легка ротація ключів, кожен запис може мати свій DEK
  envelope_encryption:
    enabled: true
    dek_algorithm: "AES-256-GCM"
    kek_provider: "aws-kms"
    kek_key_id: "arn:aws:kms:us-east-1:123456789012:key/medical-master-key"
    
    # Ротація ключів
    dek_rotation_days: 90   # DEK ротація кожні 3 місяці
    kek_rotation_days: 365  # KEK ротація раз на рік
  
  # Які поля шифруємо (по рівням чутливості)
  encrypted_fields:
    # Tier 1 - КРИТИЧНО чутливі (завжди шифруємо)
    tier1_critical:
      - "patient_ssn"                 # Номер соціального страхування
      - "credit_card_number"          # Платіжні дані
      - "bank_account"                # Банківські реквізити
      - "genetic_data"                # Генетична інформація
      - "hiv_status"                  # ВІЛ-статус
      - "psychiatric_diagnosis"       # Психіатричні діагнози
      - "substance_abuse_history"     # Історія зловживання речовинами
      - "sexual_health_data"          # Дані сексуального здоров'я
      - "biometric_data"              # Відбитки пальців, DNA
    
    # Tier 2 - Високочутливі (PHI/PII)
    tier2_high:
      - "patient_full_name"           # ПІБ пацієнта
      - "date_of_birth"               # Дата народження
      - "address"                     # Домашня адреса
      - "phone_number"                # Телефон
      - "email_address"               # Email
      - "medical_record_number"       # Номер медичної картки
      - "diagnosis"                   # Діагнози
      - "treatment_plan"              # План лікування
      - "prescription_details"        # Деталі рецептів
      - "lab_results"                 # Результати аналізів
      - "imaging_reports"             # Результати КТ/МРТ/рентген
      - "surgical_history"            # Історія операцій
      - "allergy_information"         # Алергії
      - "insurance_number"            # Номер страховки
    
    # Tier 3 - Середньочутливі
    tier3_medium:
      - "appointment_notes"           # Нотатки з прийомів
      - "vital_signs_history"         # Історія показників
      - "medication_history"          # Історія медикаментів
  
  # Additional Associated Data (AAD) для GCM
  # Дані, які автентифікуються, але НЕ шифруються
  # Приклад: patient_id, timestamp, record_type
  aad_fields:
    - "patient_id"
    - "record_id"
    - "record_type"
    - "created_timestamp"
    - "provider_id"

#########################################################################
# 4. Data Encryption (in transit)
#########################################################################
# Шифрування при передачі між клієнтом та сервером, між сервісами
# STRIDE захист: I (Information Disclosure), T (Tampering), S (Spoofing)
#########################################################################

encryption_in_transit:
  # TLS 1.3 - найновіший стандарт (RFC 8446, 2018)
  # Переваги:
  # - Швидший handshake (1-RTT vs 2-RTT)
  # - Perfect Forward Secrecy за замовчуванням
  # - Видалені застарілі cipher suites
  # - Шифрування більшості handshake
  tls:
    min_version: "1.3"
    max_version: "1.3"
    
    # Cipher suites (тільки найбезпечніші для TLS 1.3)
    cipher_suites:
      - "TLS_AES_256_GCM_SHA384"        # Найсильніший
      - "TLS_CHACHA20_POLY1305_SHA256"  # Для мобільних (без AES-NI)
      - "TLS_AES_128_GCM_SHA256"        # Швидший
    
    # Сертифікати
    certificates:
      type: "X.509"
      key_algorithm: "RSA"
      key_size: 3072              # 3072 для medical (вище 2048)
      signature_algorithm: "SHA-384"  # Не SHA-256, для вищої безпеки
      validity_days: 365
      
      # Certificate Transparency (публічний лог сертифікатів)
      # Захист від rogue CA certificates
      certificate_transparency: true
      
      # OCSP Stapling для перевірки відкликання
      ocsp_stapling: true
      
      # Certificate pinning для критичних клієнтів
      certificate_pinning_enabled: true
    
    # HSTS - HTTP Strict Transport Security
    # Браузер завжди використовує HTTPS
    hsts:
      enabled: true
      max_age_seconds: 31536000  # 1 рік
      include_subdomains: true
      preload: true              # Включити в HSTS preload list
    
    # Perfect Forward Secrecy
    # Навіть при компрометації приватного ключа,
    # старі сесії залишаються захищеними
    perfect_forward_secrecy: true
    
    # Session resumption (для performance)
    # Але з обережністю для безпеки
    session_resumption:
      enabled: true
      ticket_lifetime_seconds: 300  # 5 хвилин (коротко для безпеки)
      ticket_rotation: true
  
  # Mutual TLS (mTLS) для service-to-service
  # Обидві сторони автентифікуються сертифікатами
  # Zero-trust архітектура
  mtls:
    enabled: true
    require_client_certificate: true
    
    # Валідація клієнтського сертифікату
    client_cert_validation:
      verify_certificate_chain: true
      check_revocation: true     # OCSP/CRL перевірка
      
      # Дозволені DNS names (whitelist)
      allowed_dns_names:
        - "*.medical-records.internal"
        - "*.prescription-service.internal"
        - "*.lab-results.internal"
        - "*.patient-portal.internal"
      
      # Дозволені Organization Units
      allowed_organizational_units:
        - "Medical Microservices"
        - "Healthcare Infrastructure"
    
    # Ротація сертифікатів
    certificate_rotation_days: 90
    renewal_before_expiry_days: 30

#########################################################################
# 5. Digital Signatures & Message Authentication
#########################################################################
# Підписи медичних документів, автентичність повідомлень
# STRIDE захист: T (Tampering), R (Repudiation)
#########################################################################

digital_signatures:
  # Для юридично значущих документів
  document_signing:
    # RSA-PSS (Probabilistic Signature Scheme)
    # Безпечніше ніж RSA-PKCS1-v1.5
    algorithm: "RSA-PSS"
    key_size: 3072
    hash_algorithm: "SHA-384"
    salt_length: 48            # 384 біт / 8
    
    # Які документи підписуємо
    signed_documents:
      - "prescriptions"         # Рецепти (критично!)
      - "lab_reports"           # Результати аналізів
      - "discharge_summaries"   # Виписки з лікарні
      - "medical_certificates"  # Медичні довідки
      - "consent_forms"         # Згоди на лікування
      - "referral_letters"      # Направлення до спеціалістів
    
    # Метадані підпису
    signature_metadata:
      - "doctor_id"
      - "doctor_full_name"
      - "medical_license_number"
      - "signature_timestamp"
      - "document_hash_sha384"
      - "signature_purpose"
    
    # Зберігання підписів
    signature_storage: "immutable_audit_log"
    
    # Валідація підпису
    signature_validation:
      verify_certificate_chain: true
      check_certificate_revocation: true
      verify_timestamp: true
  
  # HMAC для міжсервісних повідомлень
  message_authentication:
    # HMAC-SHA256 - швидший за RSA, симетричний
    # Для high-throughput scenarios
    algorithm: "HMAC-SHA256"
    key_length: 256
    
    # Key derivation
    key_derivation: "PBKDF2"
    pbkdf2_iterations: 100000
    
    # Ключі зберігаються в Secrets Manager
    key_storage: "aws-secrets-manager"
    key_rotation_days: 90
    
    # Використання
    use_cases:
      - "service_to_service_api_calls"
      - "message_queue_messages"      # RabbitMQ, Kafka
      - "webhook_signatures"
      - "audit_log_integrity"
    
    # Replay attack protection
    replay_protection:
      enabled: true
      timestamp_window_seconds: 300   # 5 хвилин
      nonce_required: true
      nonce_storage: "redis"
      nonce_ttl_seconds: 600

#########################################################################
# 6. Key Management & Secrets
#########################################################################
# Зберігання та управління криптографічними ключами
# STRIDE захист: I (Information Disclosure)
#########################################################################

key_management:
  # AWS KMS - Key Management Service
  # FIPS 140-2 Level 2 validated
  kms:
    provider: "aws-kms"
    region: "us-east-1"
    
    # Master keys
    master_keys:
      database_encryption:
        key_id: "arn:aws:kms:us-east-1:123456789012:key/db-master-key"
        description: "Master key for patient database encryption"
        rotation_enabled: true
        rotation_period_days: 365
        
      backup_encryption:
        key_id: "arn:aws:kms:us-east-1:123456789012:key/backup-master-key"
        description: "Master key for backup encryption"
        rotation_enabled: true
        rotation_period_days: 365
        
      jwt_signing:
        key_id: "arn:aws:kms:us-east-1:123456789012:key/jwt-signing-key"
        description: "Private key for JWT signing"
        rotation_enabled: true
        rotation_period_days: 180
    
    # IAM policies (least privilege)
    key_policies:
      - principal: "arn:aws:iam::123456789012:role/medical-records-service"
        actions:
          - "kms:Decrypt"
          - "kms:GenerateDataKey"
        resources: ["database_encryption", "backup_encryption"]
        
      - principal: "arn:aws:iam::123456789012:role/auth-service"
        actions:
          - "kms:Sign"
          - "kms:GetPublicKey"
        resources: ["jwt_signing"]
        
      - principal: "arn:aws:iam::123456789012:role/admin"
        actions: ["kms:*"]
        resources: ["*"]
        condition:
          mfa_required: true
  
  # HashiCorp Vault для application secrets
  vault:
    address: "https://vault.medical.internal:8200"
    auth_method: "kubernetes"    # або aws, jwt, approle
    namespace: "medical-services"
    
    # Dynamic secrets (генеруються на льоту)
    dynamic_secrets:
      database_credentials:
        path: "database/creds/medical-records-rw"
        ttl_seconds: 3600        # 1 година
        max_ttl_seconds: 86400   # 24 години max
        renewable: true
        
      api_tokens:
        path: "api/tokens/external-integrations"
        ttl_seconds: 1800
        renewable: false
    
    # Static secrets (зберігаються)
    static_secrets:
      third_party_api_keys:
        path: "secret/data/integrations/lab-systems"
        version: 2               # Versioning
        
      encryption_keys:
        path: "secret/data/encryption/field-level-keys"
        version: 3
    
    # Transit (Encryption as a Service)
    transit:
      enabled: true
      mount_path: "transit"
      
      keys:
        patient_data:
          type: "aes256-gcm96"
          exportable: false      # Ключ не можна експортувати
          allow_plaintext_backup: false
          
        pii_tokenization:
          type: "aes256-gcm96"
          exportable: false
    
    # Audit logging
    audit:
      enabled: true
      log_path: "/vault/logs/audit.log"
      log_format: "json"
  
  # HSM (Hardware Security Module) для найкритичніших ключів
  # FIPS 140-2 Level 3/4
  hsm:
    enabled: true
    provider: "aws-cloudhsm"    # або Thales, SafeNet
    cluster_id: "cluster-abc123def456"
    
    # Які ключі зберігаємо в HSM
    stored_keys:
      - "root_ca_private_key"           # Root CA для сертифікатів
      - "master_encryption_key"         # Для KEK envelope encryption
      - "code_signing_key"              # Для підпису software updates
      - "document_signing_master_key"   # Для підпису медичних документів
    
    # Операції, що виконуються в HSM
    operations:
      - "key_generation"
      - "signing"
      - "encryption"
      - "decryption"
    
    # Backup (encrypted hardware backup module)
    backup:
      enabled: true
      schedule: "daily"
      encryption: "AES-256"
      offline_copy: true         # Offline копія для disaster recovery

#########################################################################
# 7. Audit Logging & Monitoring
#########################################################################
# Повний аудит всіх дій з медичними даними
# STRIDE захист: R (Repudiation), I (Insider threats detection)
#########################################################################

audit_logging:
  # Immutable logs - неможливо змінити або видалити
  # HIPAA/GDPR requirement
  immutable: true
  
  # Зберігання
  storage:
    primary: "aws-s3"
    bucket: "medical-audit-logs-prod"
    bucket_versioning: true
    bucket_encryption: "AES-256"
    
    # WORM (Write Once Read Many) для immutability
    object_lock: true
    object_lock_mode: "COMPLIANCE"  # Навіть root не може видалити
    object_lock_retention_days: 2555  # 7 років (HIPAA requirement)
    
    # Backup
    backup_storage: "aws-glacier"
    backup_schedule: "daily"
  
  # Що логуємо
  logged_events:
    # Автентифікація
    authentication:
      - "login_attempt"
      - "login_success"
      - "login_failure"
      - "logout"
      - "mfa_challenge"
      - "mfa_success"
      - "mfa_failure"
      - "password_reset_request"
      - "password_changed"
      - "session_expired"
      - "account_locked"
    
    # Доступ до даних
    data_access:
      - "patient_record_viewed"
      - "patient_record_created"
      - "patient_record_updated"
      - "patient_record_deleted"
      - "diagnosis_added"
      - "prescription_created"
      - "lab_result_viewed"
      - "medical_image_accessed"
      - "document_downloaded"
      - "document_printed"
      - "data_exported"
      - "search_performed"
    
    # Криптографічні операції
    crypto_operations:
      - "key_generated"
      - "key_rotated"
      - "key_deleted"
      - "encryption_performed"
      - "decryption_performed"
      - "signature_created"
      - "signature_verified"
      - "certificate_issued"
      - "certificate_revoked"
    
    # Адміністративні дії
    administrative:
      - "user_created"
      - "user_deleted"
      - "role_assigned"
      - "permissions_changed"
      - "configuration_modified"
      - "system_setting_changed"
      - "backup_created"
      - "backup_restored"
    
    # Security events
    security:
      - "suspicious_activity_detected"
      - "rate_limit_exceeded"
      - "unauthorized_access_attempt"
      - "sql_injection_attempt"
      - "xss_attempt"
      - "brute_force_detected"
      - "privilege_escalation_attempt"
  
  # Формат логів
  log_format:
    schema_version: "2.0"
    
    # Обов'язкові поля
    required_fields:
      - "timestamp"              # ISO8601 format
      - "event_id"               # Унікальний ID події
      - "event_type"             # Тип події
      - "user_id"                # Хто виконав
      - "user_role"              # Роль користувача
      - "session_id"             # ID сесії
      - "ip_address"             # IP адреса
      - "user_agent"             # Browser/client info
      - "action"                 # Що зробив
      - "resource_type"          # Тип ресурсу (patient, prescription)
      - "resource_id"            # ID ресурсу
      - "result"                 # success/failure
      - "error_code"             # Якщо failure
      
    # Додаткові поля (опціональні)
    optional_fields:
      - "patient_id"             # УВАГА: тільки ID, не PHI!
      - "department"
      - "geolocation"
      - "device_id"
      - "request_id"             # Для трейсингу
      - "duration_ms"
      - "data_size_bytes"
  
  # Шифрування та підпис логів
  log_protection:
    encryption:
      enabled: true
      algorithm: "AES-256-GCM"
      key_source: "aws-kms"
      key_id: "arn:aws:kms:us-east-1:123456789012:key/audit-log-key"
      
    digital_signature:
      enabled: true
      algorithm: "RSA-PSS"
      key_size: 3072
      hash_algorithm: "SHA-384"
      
    # Chained hashing для tamper detection
    # Кожен лог містить hash попереднього
    chain_hashing:
      enabled: true
      algorithm: "SHA-384"
  
  # Retention (скільки зберігаємо)
  retention:
    active_storage_days: 365    # 1 рік у активному сховищі
    archive_storage_years: 7    # 7 років в архіві (HIPAA)
    deletion_after_years: 7     # Видалення після 7 років

#########################################################################
# 8. Security Monitoring & Alerting
#########################################################################
# Виявлення атак та підозрілої активності в реальному часі
# STRIDE захист: Всі категорії (detection & response)
#########################################################################

security_monitoring:
  # SIEM (Security Information and Event Management)
  siem:
    enabled: true
    platform: "splunk"          # або ELK, Datadog, etc.
    endpoint: "https://siem.medical.internal:8088"
    
    # Що відправляємо в SIEM
    forwarded_logs:
      - "audit_logs"
      - "application_logs"
      - "system_logs"
      - "network_logs"
      - "database_logs"
  
  # Anomaly detection (ML-based)
  anomaly_detection:
    enabled: true
    
    # Behavioral analytics
    user_behavior:
      - "unusual_access_patterns"     # Доступ у незвичний час
      - "mass_data_access"            # Багато записів за короткий час
      - "geographic_anomalies"        # Доступ з незвичної локації
      - "unusual_data_export"         # Великі експорти даних
      - "privilege_usage_anomalies"   # Незвичне використання прав
    
    # ML model
    ml_model:
      algorithm: "isolation_forest"
      training_data_days: 90
      retraining_frequency_days: 7
      anomaly_threshold: 0.85         # 85% confidence
  
  # Real-time alerts
  alerting:
    # Канали сповіщення
    channels:
      email:
        enabled: true
        recipients:
          - "security-team@medical.com"
          - "soc@medical.com"
          
      slack:
        enabled: true
        webhook_url: "${SLACK_SECURITY_WEBHOOK}"
        channel: "#security-alerts"
        
      pagerduty:
        enabled: true
        service_key: "${PAGERDUTY_SERVICE_KEY}"
        severity_threshold: "high"
      
      sms:
        enabled: true
        provider: "twilio"
        numbers:
          - "+1234567890"  # Security Lead
        
    # Правила alerting
    alert_rules:
      # Critical alerts (негайне реагування)
      critical:
        - name: "Multiple failed login attempts"
          condition: "failed_logins >= 5 in 10 minutes"
          action: "block_ip + notify_security + require_mfa"
          
        - name: "Encryption key accessed"
          condition: "any_access_to_master_keys"
          action: "immediate_alert + log_detailed"
          
        - name: "Mass patient data access"
          condition: "patient_records_accessed >= 100 in 1 hour"
          action: "immediate_alert + require_justification + notify_manager"
          
        - name: "Configuration change"
          condition: "crypto_config_modified OR security_settings_modified"
          action: "immediate_alert + require_approval + rollback_available"
          
        - name: "Unauthorized access attempt"
          condition: "access_denied_to_sensitive_data"
          action: "log + notify_security"
          
        - name: "Data exfiltration suspected"
          condition: "data_export_size > 1GB OR download_speed_anomaly"
          action: "immediate_alert + block_action + investigate"
      
      # High priority alerts
      high:
        - name: "After-hours access"
          condition: "access_time between 23:00 and 06:00"
          action: "log + notify_manager"
          
        - name: "Privileged action"
          condition: "admin_action OR database_direct_access"
          action: "log + notify_security"
          
        - name: "Failed decryption"
          condition: "decryption_error OR invalid_key"
          action: "alert + investigate_key_integrity"
      
      # Medium priority
      medium:
        - name: "Geographic anomaly"
          condition: "ip_location != usual_location"
          action: "log + require_additional_verification"
          
        - name: "New device login"
          condition: "device_fingerprint != known_devices"
          action: "require_mfa + notify_user"
  
  # Threat intelligence integration
  threat_intelligence:
    enabled: true
    
    # Фіди загроз
    feeds:
      - "alienvault_otx"
      - "abuse_ch"
      - "emergingthreats"
      
    # Перевірки
    checks:
      - "ip_reputation"
      - "domain_reputation"
      - "file_hash_reputation"
      - "known_malicious_patterns"

#########################################################################
# 9. Access Control (RBAC + ABAC)
#########################################################################
# Контроль доступу до медичних даних
# STRIDE захист: E (Elevation of Privilege), I (Information Disclosure)
#########################################################################

access_control:
  # RBAC - Role-Based Access Control
  rbac:
    enabled: true
    
    # Визначення ролей
    roles:
      # Лікарі
      doctor:
        description: "Лікар з повним доступом до пацієнтів"
        permissions:
          patients:
            - "read:patient_records"
            - "write:patient_records"
            - "create:diagnosis"
            - "update:diagnosis"
            - "create:prescriptions"
            - "read:lab_results"
            - "order:lab_tests"
            - "access:medical_images"
            - "sign:medical_documents"
          
          administrative:
            - "read:own_schedule"
            - "update:own_profile"
        
        constraints:
          - "own_patients_only"          # Тільки свої пацієнти
          - "same_department"             # Або того самого відділення
          - "with_consent"                # З згодою пацієнта
        
        mfa_required: true
        session_timeout_minutes: 30
      
      # Медсестри
      nurse:
        description: "Медсестра з обмеженим доступом"
        permissions:
          patients:
            - "read:patient_records"
            - "write:vital_signs"
            - "write:nursing_notes"
            - "read:prescriptions"
            - "record:medication_administration"
          
          administrative:
            - "read:own_schedule"
        
        constraints:
          - "assigned_patients_only"      # Тільки призначені пацієнти
          - "current_shift"               # Під час зміни
        
        mfa_required: true
        session_timeout_minutes: 20
      
      # Лаборанти
      lab_technician:
        description: "Лаборант - результати аналізів"
        permissions:
          lab:
            - "read:lab_orders"
            - "write:lab_results"
            - "upload:lab_images"
            - "update:test_status"
          
          patients:
            - "read:patient_demographics"  # Тільки базова інформація
        
        constraints:
          - "lab_orders_only"
          - "no_diagnosis_access"
        
        mfa_required: true
        session_timeout_minutes: 30
      
      # Фармацевти
      pharmacist:
        description: "Фармацевт - доступ до рецептів"
        permissions:
          pharmacy:
            - "read:prescriptions"
            - "verify:prescriptions"
            - "dispense:medications"
            - "check:drug_interactions"
          
          patients:
            - "read:allergy_information"
            - "read:current_medications"
        
        constraints:
          - "active_prescriptions_only"
          - "pharmacy_location"
        
        mfa_required: true
        session_timeout_minutes: 20
      
      # Пацієнти
      patient:
        description: "Пацієнт - доступ до своїх даних"
        permissions:
          own_data:
            - "read:own_records"
            - "read:own_prescriptions"
            - "read:own_lab_results"
            - "read:own_imaging"
            - "update:contact_information"
            - "manage:consent_preferences"
            - "request:appointment"
            - "message:doctor"
        
        constraints:
          - "own_data_only"               # Тільки свої дані!
          - "no_clinical_notes_access"    # Без клінічних нотаток лікаря
        
        mfa_required: false               # Опціонально для пацієнтів
        session_timeout_minutes: 15
      
      # Дослідники
      researcher:
        description: "Медичний дослідник - анонімізовані дані"
        permissions:
          research:
            - "read:anonymized_data"
            - "export:statistical_data"
            - "run:queries"
        
        constraints:
          - "no_pii_access"               # БЕЗ персональних даних
          - "no_direct_identifiers"
          - "approved_studies_only"
          - "with_irb_approval"           # З схваленням етичної комісії
        
        mfa_required: true
        session_timeout_minutes: 60
      
      # Адміністратори
      admin:
        description: "Системний адміністратор"
        permissions:
          system:
            - "manage:users"
            - "manage:roles"
            - "configure:system"
            - "read:audit_logs"
            - "manage:backups"
            - "configure:security_settings"
        
        constraints:
          - "no_patient_data_access"      # Адмін НЕ має доступу до даних пацієнтів!
          - "approval_required_for_config_changes"
        
        mfa_required: true
        session_timeout_minutes: 20
        
      # Security Officer
      security_officer:
        description: "Офіцер безпеки"
        permissions:
          security:
            - "read:all_audit_logs"
            - "investigate:security_incidents"
            - "manage:access_controls"
            - "review:user_activity"
            - "revoke:access"
        
        constraints:
          - "audit_only"
          - "no_data_modification"
        
        mfa_required: true
        session_timeout_minutes: 30
  
  # ABAC - Attribute-Based Access Control
  # Для складніших сценаріїв
  abac:
    enabled: true
    
    # Політики доступу
    policies:
      # Екстрений доступ (break-glass)
      emergency_access:
        description: "Екстрений доступ до будь-яких записів при невідкладних станах"
        condition: |
          user.role == 'doctor' AND
          context.emergency == true AND
          context.location == 'emergency_department'
        allow:
          - "access:all_patient_records"
        audit: "detailed"                   # Детальний аудит
        require_justification: true         # Обов'язкове обгрунтування
        notify:
          - "security_team"
          - "patient_privacy_officer"
        time_limit_minutes: 60              # Тільки 1 година
      
      # Доступ для дослідження з згодою пацієнта
      research_with_consent:
        description: "Доступ дослідника до даних при наявності згоди"
        condition: |
          user.role == 'researcher' AND
          patient.research_consent == true AND
          study.approved_by_irb == true
        allow:
          - "read:anonymized_clinical_data"
        deny:
          - "read:patient_name"
          - "read:patient_ssn"
          - "read:patient_address"
        audit: "detailed"
      
      # Доступ після робочих годин
      after_hours_access:
        description: "Підвищені вимоги до доступу після робочих годин"
        condition: |
          time.hour >= 23 OR time.hour <= 6
        require:
          - "mfa"
          - "manager_approval"
          - "justification"
        audit: "enhanced"
        alert: "security_team"
      
      # Доступ до особливо чутливих діагнозів
      sensitive_diagnosis_access:
        description: "Обмежений доступ до ВІЛ, психіатрії, онкології"
        condition: |
          record.diagnosis_category IN ['hiv', 'psychiatric', 'genetic']
        require:
          - "explicit_patient_consent"
          - "legitimate_treatment_purpose"
          - "specialized_training"
        audit: "maximum"
        notify: "patient"                   # Сповістити пацієнта
      
      # Міжвідомчий доступ
      cross_department_access:
        description: "Доступ лікаря до пацієнта іншого відділення"
        condition: |
          user.department != patient.primary_department
        require:
          - "referral_exists"
          - "consultation_request_approved"
        audit: "detailed"
        notify: "primary_care_physician"
  
  # Least Privilege Principle
  least_privilege:
    enabled: true
    default_deny: true                      # За замовчуванням - відмова
    explicit_grant_required: true           # Явне надання прав
    
    # Ревізія прав доступу
    access_review:
      frequency_days: 90                    # Кожні 3 місяці
      automatic_revocation: true            # Автоматичне відкликання неактивних
      inactive_period_days: 60
  
  # MFA (Multi-Factor Authentication)
  mfa:
    enforcement: "role_based"               # Залежить від ролі
    
    methods:
      - "totp"                              # Time-based OTP (Google Authenticator)
      - "sms"                               # SMS код
      - "push_notification"                 # Duo, Okta Verify
      - "hardware_token"                    # YubiKey для адміністраторів
      - "biometric"                         # Відбиток пальця, Face ID
    
    required_for_roles:
      - "doctor"
      - "nurse"
      - "pharmacist"
      - "admin"
      - "security_officer"
      - "researcher"
    
    bypass_not_allowed: true                # Неможливо обійти
    remember_device_days: 30                # Запам'ятати пристрій на 30 днів

#########################################################################
# 10. Compliance & Data Protection
#########################################################################
# Відповідність законодавству та захист даних
#########################################################################

compliance:
  # HIPAA (Health Insurance Portability and Accountability Act)
  hipaa:
    enabled: true
    
    requirements:
      # Privacy Rule
      privacy_rule:
        - "minimum_necessary_access"        # Мінімум необхідної інформації
        - "patient_consent_management"
        - "notice_of_privacy_practices"
        - "patient_rights_to_access"
        - "patient_rights_to_amendment"
        
      # Security Rule
      security_rule:
        administrative_safeguards:
          - "security_management_process"
          - "assigned_security_responsibility"
          - "workforce_security"
          - "information_access_management"
          - "security_awareness_training"
          - "security_incident_procedures"
          - "contingency_plan"
          - "business_associate_contracts"
          
        physical_safeguards:
          - "facility_access_controls"
          - "workstation_use_policy"
          - "workstation_security"
          - "device_media_controls"
          
        technical_safeguards:
          - "access_controls"               # ✅ RBAC/ABAC
          - "audit_controls"                # ✅ Immutable logs
          - "integrity_controls"            # ✅ Digital signatures
          - "transmission_security"         # ✅ TLS 1.3
      
      # Breach Notification Rule
      breach_notification:
        enabled: true
        notification_deadline_hours: 72     # 72 години для сповіщення
        notify:
          - "affected_patients"
          - "hhs_secretary"                 # Міністерство охорони здоров'я
          - "media"                         # Якщо >500 осіб
        
    audit_retention_years: 6
  
  # GDPR (General Data Protection Regulation)
  gdpr:
    enabled: true
    
    requirements:
      # Lawful basis for processing
      lawful_basis:
        - "consent"                         # Згода пацієнта
        - "legitimate_interest"             # Легітимний інтерес
        - "vital_interests"                 # Життєво важливі інтереси
        
      # Data subject rights
      data_subject_rights:
        - "right_to_access"                 # Право на доступ
        - "right_to_rectification"          # Право на виправлення
        - "right_to_erasure"                # Право на видалення
        - "right_to_restrict_processing"    # Право на обмеження обробки
        - "right_to_data_portability"       # Право на перенесення
        - "right_to_object"                 # Право на заперечення
        
      # Privacy by design
      privacy_by_design:
        - "data_minimization"               # Мінімізація даних
        - "purpose_limitation"              # Обмеження мети
        - "storage_limitation"              # Обмеження зберігання
        - "accuracy"                        # Точність
        - "integrity_confidentiality"       # Цілісність та конфіденційність
      
      # Data Protection Impact Assessment
      dpia:
        required: true
        frequency_months: 12
        
      # Breach notification
      breach_notification:
        enabled: true
        notification_deadline_hours: 72
        notify:
          - "data_protection_authority"
          - "affected_individuals"
    
    consent_management:
      explicit_consent: true
      granular_consent: true                # Окрема згода на різні типи обробки
      withdraw_consent_easy: true
      consent_records_retention_years: 7
  
  # PCI DSS (для обробки платіжних даних)
  pci_dss:
    enabled: true
    level: 1                                # Найвищий рівень
    
    requirements:
      - "build_maintain_secure_network"     # ✅ Firewall, secure configs
      - "protect_cardholder_data"           # ✅ AES-256 encryption
      - "maintain_vulnerability_management" # ✅ Patching, AV
      - "implement_access_controls"         # ✅ RBAC, MFA
      - "monitor_test_networks"             # ✅ Audit logs, monitoring
      - "maintain_information_security"     # ✅ Security policies
    
    quarterly_scans: true
    annual_assessment: true

#########################################################################
# 11. Incident Response
#########################################################################
# Реагування на інциденти безпеки
#########################################################################

incident_response:
  # План реагування
  response_plan:
    enabled: true
    
    # Фази реагування
    phases:
      - "preparation"                       # Підготовка
      - "detection_analysis"                # Виявлення та аналіз
      - "containment_eradication"           # Стримування та усунення
      - "recovery"                          # Відновлення
      - "post_incident_activity"            # Пост-інцидентна активність
    
    # Команда реагування
    incident_response_team:
      - "security_officer"
      - "system_administrator"
      - "legal_counsel"
      - "privacy_officer"
      - "public_relations"
    
    # Контактна інформація
    contacts:
      security_hotline: "+1-800-SECURITY"
      email: "security-incident@medical.com"
      slack: "#security-incidents"
    
  # Класифікація інцидентів
  incident_classification:
    severity_levels:
      critical:
        examples:
          - "ransomware_attack"
          - "mass_data_breach"
          - "system_compromise"
        response_time_minutes: 15
        escalation: "immediate"
        
      high:
        examples:
          - "unauthorized_access"
          - "malware_detected"
          - "ddos_attack"
        response_time_minutes: 60
        escalation: "within_1_hour"
        
      medium:
        examples:
          - "suspicious_activity"
          - "failed_login_attempts"
          - "policy_violation"
        response_time_hours: 4
        escalation: "same_day"
        
      low:
        examples:
          - "phishing_email"
          - "minor_policy_violation"
        response_time_hours: 24
        escalation: "next_business_day"
  
  # Автоматичні дії
  automated_response:
    enabled: true
    
    actions:
      - trigger: "brute_force_detected"
        action: "block_ip_address"
        duration_minutes: 60
        
      - trigger: "malware_detected"
        action: "isolate_system"
        notify: "security_team"
        
      - trigger: "ransomware_indicators"
        action: "disconnect_network + snapshot_system + alert_critical"
        
      - trigger: "mass_data_access"
        action: "suspend_user + require_investigation"

#########################################################################
# 12. Backup & Disaster Recovery
#########################################################################
# Резервне копіювання та відновлення
# STRIDE захист: D (Denial of Service - Ransomware)
#########################################################################

backup_disaster_recovery:
  # Backup strategy
  backup:
    enabled: true
    
    # 3-2-1 правило:
    # 3 копії даних
    # 2 різні типи носіїв
    # 1 копія офсайт (offline)
    strategy: "3-2-1"
    
    # Розклад
    schedule:
      full_backup:
        frequency: "weekly"
        day: "sunday"
        time: "02:00"
        
      incremental_backup:
        frequency: "daily"
        time: "03:00"
        
      transaction_log_backup:
        frequency: "every_15_minutes"
    
    # Шифрування backup
    encryption:
      enabled: true                         # ОБОВ'ЯЗКОВО!
      algorithm: "AES-256-GCM"
      key_source: "aws-kms"
      key_id: "arn:aws:kms:us-east-1:123456789012:key/backup-key"
    
    # Зберігання
    storage:
      primary: "aws-s3"
      secondary: "aws-glacier"              # Довгострокове зберігання
      offline: "tape_library"               # Offline для ransomware protection
      
      geographic_redundancy: true           # Різні регіони
      regions:
        - "us-east-1"
        - "us-west-2"
        - "eu-west-1"
    
    # Retention
    retention:
      daily_backups_days: 30
      weekly_backups_months: 12
      monthly_backups_years: 7              # HIPAA requirement
      
    # Тестування backup
    backup_testing:
      frequency: "monthly"
      restore_test: true
      verification: "checksum"
  
  # Disaster Recovery
  disaster_recovery:
    # RPO (Recovery Point Objective) - скільки даних можна втратити
    rpo_minutes: 15                         # Максимум 15 хвилин даних
    
    # RTO (Recovery Time Objective) - за скільки відновити
    rto_hours: 4                            # Максимум 4 години
    
    # Hot standby
    hot_standby:
      enabled: true
      location: "us-west-2"                 # Інший регіон
      replication: "synchronous"
      automatic_failover: true
    
    # DR plan
    disaster_recovery_plan:
      documented: true
      tested_quarterly: true
      scenarios:
        - "datacenter_outage"
        - "ransomware_attack"
        - "natural_disaster"
        - "cyber_attack"
        - "hardware_failure"

#########################################################################
# 13. Rate Limiting & DDoS Protection
#########################################################################
# Захист від атак відмови в обслуговуванні
# STRIDE захист: D (Denial of Service)
#########################################################################

rate_limiting:
  enabled: true
  
  # Per-endpoint rate limits
  endpoints:
    authentication:
      login:
        requests_per_minute: 5              # 5 спроб на хвилину
        requests_per_hour: 20
        burst: 2
        
      password_reset:
        requests_per_hour: 3
        requests_per_day: 10
    
    api:
      read_patient_record:
        requests_per_minute: 60
        requests_per_hour: 1000
        
      create_prescription:
        requests_per_minute: 10
        requests_per_hour: 100
      
      search:
        requests_per_minute: 30
        requests_per_hour: 500
  
  # Per-user rate limits
  user_limits:
    authenticated:
      requests_per_second: 10
      requests_per_minute: 300
      
    unauthenticated:
      requests_per_second: 1
      requests_per_minute: 20
  
  # Response на перевищення
  throttle_response:
    status_code: 429                        # Too Many Requests
    retry_after_seconds: 60
    message: "Rate limit exceeded. Please try again later."
  
  # DDoS Protection
  ddos_protection:
    enabled: true
    provider: "cloudflare"                  # або AWS Shield Advanced
    
    protections:
      - "syn_flood_protection"
      - "udp_flood_protection"
      - "http_flood_protection"
      - "slowloris_protection"
      - "layer7_ddos_protection"
    
    # WAF (Web Application Firewall)
    waf:
      enabled: true
      rule_sets:
        - "owasp_top_10"
        - "known_bad_inputs"
        - "sql_injection_prevention"
        - "xss_prevention"
        - "rate_limiting"

