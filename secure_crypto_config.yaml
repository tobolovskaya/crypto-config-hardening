# ═══════════════════════════════════════════════════════════════════════════════
# БЕЗПЕЧНА КРИПТОГРАФІЧНА КОНФІГУРАЦІЯ
# ═══════════════════════════════════════════════════════════════════════════════
# Створено відповідно до сучасних стандартів безпеки (OWASP, NIST, RFC)
# Дата: Грудень 2025
# ═══════════════════════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────────────────────
# 1. JWT (JSON Web Tokens) - Налаштування автентифікації
# ───────────────────────────────────────────────────────────────────────────────
jwt:
  # Алгоритм підпису: RS256 (RSA Signature with SHA-256)
  # Чому RS256:
  # - Асиметрична криптографія (приватний ключ для підпису, публічний для перевірки)
  # - Публічний ключ можна безпечно розповсюджувати через JWKS endpoint
  # - Підходить для мікросервісної архітектури (сервіси перевіряють без доступу до приватного ключа)
  # - Рекомендовано IETF RFC 7518
  # Альтернативи: ES256 (ECDSA, швидший), HS256 (симетричний, для простих систем)
  algorithm: RS256

  # Розмір ключа: 2048 біт (мінімум для RSA)
  # Чому 2048:
  # - NIST рекомендує мінімум 2048 біт до 2030 року
  # - Баланс між безпекою та продуктивністю
  # - Для критичних систем можна використати 3072 або 4096 біт
  key_size: 2048

  # Завжди перевіряємо підпис токену
  # Чому true:
  # - Гарантує автентичність токену (не підроблений)
  # - Гарантує цілісність (не змінений)
  # - Основа безпеки JWT - БЕЗ ВИНЯТКІВ
  verify_signature: true

  # Налаштування claims (тверджень у токені)
  claims:
    # Вимагаємо поле exp (expiration time)
    # Чому важливо:
    # - Обмежує час життя токену
    # - Зменшує вікно для атак при компрометації
    # - Відповідає RFC 7519
    exp_required: true

    # Максимальний термін дії: 900 секунд (15 хвилин)
    # Чому 15 хвилин:
    # - Access tokens повинні бути короткотривалими
    # - Баланс між безпекою та зручністю
    # - Використовується разом з refresh tokens (довготривалими)
    # - Рекомендація OWASP для access tokens: 5-15 хвилин
    exp_max_time: 900

    # Вимагаємо поле iat (issued at - час створення)
    # Чому важливо:
    # - Дозволяє визначити вік токену
    # - Допомагає відхилити старі токени
    # - Необхідно для token refresh логіки
    iat_required: true

    # Перевіряємо поле nbf (not before - не раніше ніж)
    # Чому важливо:
    # - Захист від використання токенів "з майбутнього"
    # - Важливо для розподілених систем з різницею в часі
    # - Дозволяє створити токени, що стануть дійсними пізніше
    nbf_check: true

    # Перевіряємо audience (для кого призначений токен)
    # Чому важливо:
    # - Токен не можна використати для іншого API/сервісу
    # - Захист від token substitution attacks
    # - Рекомендація RFC 7519 для production
    aud_check: true
    aud_value: "${APP_AUDIENCE}"  # З змінної оточення, наприклад: "api.myapp.com"

    # Перевіряємо issuer (хто видав токен)
    # Чому важливо:
    # - Токен прийнятний тільки від довіреного сервера автентифікації
    # - Захист від підроблених токенів з інших джерел
    # - Критично для федеративної автентифікації
    iss_check: true
    iss_value: "${AUTH_SERVER}"   # З змінної оточення, наприклад: "auth.myapp.com"

  # Зберігання приватного ключа
  # Чому HSM (Hardware Security Module):
  # - Ключ ніколи не покидає захищене апаратне середовище
  # - Захист від витоку навіть при компрометації сервера
  # - Відповідає PCI DSS, FIPS 140-2
  # Альтернативи: KMS (AWS KMS, Azure Key Vault) для хмарних рішень
  private_key_storage: hsm

  # Розповсюдження публічного ключа через JWKS
  # Чому JWKS (JSON Web Key Set):
  # - Стандартний спосіб розповсюдження публічних ключів (RFC 7517)
  # - Підтримує ротацію ключів без зупинки сервісу
  # - Автоматичне оновлення ключів у клієнтів
  # Endpoint: https://your-auth-server.com/.well-known/jwks.json
  public_key_distribution: jwks

  # Ротація ключів
  # Чому важливо:
  # - Обмежує час життя потенційно скомпрометованого ключа
  # - Best practice для довгострокових систем
  # - Рекомендація: кожні 90 днів
  key_rotation_enabled: true
  key_rotation_days: 90

  # Додаткові заголовки JWT
  headers:
    # kid (key ID) - ідентифікатор ключа
    # Чому важливо:
    # - Дозволяє використовувати кілька ключів одночасно
    # - Необхідно для безшовної ротації ключів
    # - Вказує, яким ключем з JWKS перевіряти підпис
    kid_enabled: true

    # typ (type) - тип токену
    # Значення: "JWT"
    # Чому: Явно вказує тип токену, допомагає при валідації
    typ: JWT


# ───────────────────────────────────────────────────────────────────────────────
# 2. PASSWORDS - Безпечне зберігання паролів
# ───────────────────────────────────────────────────────────────────────────────
passwords:
  # Функція хешування: Argon2id
  # Чому Argon2id:
  # - Переможець Password Hashing Competition 2015
  # - Найсучасніший та найбезпечніший алгоритм хешування паролів
  # - Стійкий до GPU/ASIC атак (memory-hard)
  # - Захист від side-channel attacks
  # - Рекомендовано OWASP (2024), RFC 9106
  # - "id" = hybrid version (захист від time-memory trade-off та side-channel)
  # Альтернативи: bcrypt (старіший, але все ще безпечний), scrypt
  hash_function: argon2id

  # Time cost (кількість ітерацій): 2
  # Чому 2:
  # - Мінімальне значення за рекомендацією OWASP
  # - Збільшує час обчислення хешу (ускладнює brute-force)
  # - Для дуже критичних систем можна збільшити до 3-4
  # - Баланс: хешування має займати ~100-500 мс
  time_cost: 2

  # Memory cost (використання пам'яті): 19456 KiB = 19 MiB
  # Чому 19 MiB:
  # - Рекомендація OWASP для серверних застосунків
  # - Робить GPU/ASIC атаки економічно невигідними
  # - Для дуже критичних систем: 64-128 MiB
  # - Для мобільних/браузерів: 4-8 MiB
  memory_cost: 19456

  # Parallelism (паралельні потоки): 1
  # Чому 1:
  # - Достатньо для більшості серверів
  # - Можна збільшити відповідно до кількості CPU cores
  # - Рекомендація: не більше ніж кількість доступних ядер
  parallelism: 1

  # Довжина вихідного хешу: 32 байти
  # Чому 32:
  # - 256 біт - стандарт для криптографічної стійкості
  # - Відповідає довжині ключів AES-256
  # - Достатньо для унікальності (2^256 можливих значень)
  hash_length: 32

  # Довжина солі: 16 байт (128 біт)
  # Чому 16 байт:
  # - Мінімум 128 біт рекомендовано NIST
  # - Гарантує унікальність (2^128 комбінацій)
  # - Запобігає rainbow table атакам
  # - Сіль генерується випадково для КОЖНОГО пароля
  salt_length: 16

  # Стратегія генерації солі
  # Чому random_per_password:
  # - КРИТИЧНО: кожен пароль має унікальну випадкову сіль
  # - Однакові паролі матимуть різні хеші
  # - Унеможливлює pre-computed rainbow tables
  # - Автоматична генерація через CSPRNG
  salt_strategy: random_per_password

  # Додаткові налаштування безпеки
  security:
    # Мінімальна довжина пароля
    # Чому 12:
    # - Рекомендація NIST SP 800-63B (2024)
    # - Баланс між безпекою та зручністю
    # - Для критичних систем: 16+
    min_length: 12

    # Максимальна довжина (захист від DoS)
    # Чому 128:
    # - Захист від DoS атак через надто довгі паролі
    # - Достатньо для парафраз
    max_length: 128

    # Перевірка на викриті паролі
    # Використовуємо Have I Been Pwned API
    # Чому важливо:
    # - Багато користувачів використовують скомпрометовані паролі
    # - k-anonymity model (безпечно, не передає паролі)
    # - Значно підвищує загальну безпеку
    check_pwned: true

    # Pepper (додатковий секрет на рівні додатка)
    # Чому важливо:
    # - Додатковий шар захисту якщо БД скомпрометована
    # - Зберігається окремо від БД (в HSM або змінних оточення)
    # - Атакуючий потребує і БД, і pepper
    pepper_enabled: true
    pepper_storage: "${PASSWORD_PEPPER}"  # З змінної оточення або HSM


# ───────────────────────────────────────────────────────────────────────────────
# 3. ENCRYPTION - Шифрування даних
# ───────────────────────────────────────────────────────────────────────────────
encryption:
  # Алгоритм: AES-256-GCM (Advanced Encryption Standard, Galois/Counter Mode)
  # Чому AES-256-GCM:
  # - Стандарт шифрування, рекомендований NIST
  # - 256 біт - максимальна довжина ключа AES (стійкий навіть до квантових комп'ютерів)
  # - GCM = Authenticated Encryption with Associated Data (AEAD)
  # - Забезпечує ОДНОЧАСНО: конфіденційність + автентичність + цілісність
  # - Швидкий (апаратна підтримка AES-NI в CPU)
  # - Рекомендовано RFC 5288, NIST SP 800-38D
  # Альтернативи: ChaCha20-Poly1305 (для мобільних без AES-NI)
  algorithm: AES-256-GCM

  # Довжина ключа: 256 біт
  # Чому 256:
  # - Максимальна безпека AES
  # - Стійкість до квантових атак (Grover's algorithm: ефективно 128 біт)
  # - Рекомендація NIST для TOP SECRET даних
  # - Стандарт для фінансових та медичних даних
  key_length: 256

  # Стратегія генерації IV/Nonce
  # Чому crypto_random_nonce:
  # - КРИТИЧНО для GCM: nonce НІКОЛИ не повинен повторюватись з тим же ключем
  # - Використовуємо CSPRNG (Cryptographically Secure Pseudo-Random Number Generator)
  # - Випадковий nonce для КОЖНОЇ операції шифрування
  # - Повторення nonce в GCM = ПОВНА компрометація безпеки
  iv_strategy: crypto_random_nonce

  # Довжина nonce: 96 біт (12 байт)
  # Чому 96 біт:
  # - Оптимальна довжина для GCM (рекомендація NIST SP 800-38D)
  # - Ефективність: не потребує додаткових обчислень
  # - Інші довжини можливі, але менш ефективні
  # - 96 біт = 2^96 унікальних значень
  nonce_length: 96

  # Генератор nonce
  # Чому CSPRNG:
  # - Криптографічно стійкий генератор випадкових чисел
  # - Непередбачуваність (не можна передбачити наступне значення)
  # - Приклади: /dev/urandom (Linux), CryptGenRandom (Windows), crypto.getRandomValues (JS)
  nonce_generation: csprng

  # Довжина authentication tag: 128 біт
  # Чому 128:
  # - GCM генерує MAC tag для автентифікації
  # - 128 біт = найкраща довжина для GCM (можливо 96, 104, 112, 120, 128)
  # - Гарантує автентичність та цілісність зашифрованих даних
  # - Захист від tampering (підміни даних)
  tag_length: 128

  # Additional Authenticated Data (AAD)
  # Чому enabled:
  # - Дозволяє автентифікувати дані, які не потрібно шифрувати
  # - Приклад: заголовки, metadata, версія протоколу
  # - Додатковий захист від підміни контексту
  authenticated_data_enabled: true

  # Зберігання ключів шифрування
  # Чому HSM (Hardware Security Module):
  # - Ключі генеруються та зберігаються в апаратному модулі
  # - Ключі НІКОЛИ не виходять з HSM в незашифрованому вигляді
  # - Стійкість до фізичних атак (tamper-resistant)
  # - Відповідає FIPS 140-2 Level 3/4, PCI DSS
  # Альтернативи для хмари: AWS KMS, Azure Key Vault, Google Cloud KMS
  key_storage: hsm

  # Envelope Encryption (конвертне шифрування)
  # Чому enabled:
  # - Дані шифруються Data Encryption Key (DEK)
  # - DEK шифрується Key Encryption Key (KEK) в HSM/KMS
  # - Швидше (симетричне шифрування даних)
  # - Безпечніше (KEK захищений HSM)
  # - Легша ротація (перешифровуємо тільки DEK)
  envelope_encryption: true

  # Шифрування бази даних
  database:
    # Шифрування на рівні стовпців
    # Чому column-level:
    # - Шифруємо тільки чутливі дані (PII, фінансові дані)
    # - Більш гранулярний контроль доступу
    # - Менше навантаження ніж full database encryption
    # Альтернативи: transparent data encryption (TDE) для всієї БД
    encryption_level: column

    # Які поля шифрувати
    # Завжди шифруємо:
    # - Персональні дані (ПІБ, email, телефон)
    # - Фінансові дані (номери карток, рахунки)
    # - Медичні дані (діагнози, історія хвороб)
    # - Будь-які дані згідно GDPR, HIPAA, PCI DSS
    sensitive_fields:
      - ssn              # Social Security Number
      - credit_card      # Номери кредитних карток
      - bank_account     # Банківські рахунки
      - medical_records  # Медичні записи
      - personal_notes   # Персональні нотатки

  # Ротація ключів шифрування
  # Чому важливо:
  # - Обмежує кількість даних зашифрованих одним ключем
  # - Обмежує час життя скомпрометованого ключа
  # - Відповідає compliance вимогам (PCI DSS: щорічно)
  key_rotation:
    enabled: true
    rotation_days: 90  # Кожні 90 днів (можна частіше для критичних систем)
    
    # Стратегія ротації
    # Чому online:
    # - Перешифровуємо дані новим ключем без downtime
    # - Старі ключі зберігаємо для розшифрування старих даних
    # - Поступова міграція (не все одразу)
    strategy: online


# ───────────────────────────────────────────────────────────────────────────────
# 4. TLS/SSL - Захист транспортного рівня
# ───────────────────────────────────────────────────────────────────────────────
tls:
  # Мінімальна версія TLS: 1.3
  # Чому TLS 1.3:
  # - Найновіший стандарт (RFC 8446, 2018)
  # - Видалені застарілі cipher suites
  # - Швидший handshake (1-RTT замість 2-RTT)
  # - Forward secrecy за замовчуванням
  # - Шифрування метаданих handshake
  # - TLS 1.0, 1.1 заборонені (PCI DSS з 2018)
  min_version: "1.3"

  # Дозволені cipher suites (для TLS 1.3)
  # Чому ці:
  # - Тільки AEAD ciphers (автентифіковане шифрування)
  # - Perfect Forward Secrecy (PFS)
  # - Рекомендовано Mozilla SSL Configuration Generator
  cipher_suites:
    - TLS_AES_256_GCM_SHA384       # Найбезпечніший
    - TLS_CHACHA20_POLY1305_SHA256 # Для мобільних
    - TLS_AES_128_GCM_SHA256       # Швидкий

  # HTTP Strict Transport Security (HSTS)
  # Чому enabled:
  # - Змушує браузери використовувати тільки HTTPS
  # - Захист від SSL stripping attacks
  # - Захист від man-in-the-middle
  hsts:
    enabled: true
    max_age: 31536000      # 1 рік (в секундах)
    include_subdomains: true
    preload: true          # Включення в HSTS preload list браузерів

  # Certificate Transparency
  # Чому enabled:
  # - Публічний журнал всіх виданих сертифікатів
  # - Виявлення підроблених сертифікатів
  # - Вимога браузерів (Chrome, Safari)
  certificate_transparency: true


# ───────────────────────────────────────────────────────────────────────────────
# 5. СЕКРЕТНІ ДАНІ - Управління
# ───────────────────────────────────────────────────────────────────────────────
secrets_management:
  # Де зберігати секрети
  # Чому vault:
  # - Централізоване зберігання секретів
  # - Шифрування в стані спокою та передачі
  # - Аудит логи доступу
  # - Динамічні секрети (генерація на льоту)
  # - Автоматична ротація
  # Рішення: HashiCorp Vault, AWS Secrets Manager, Azure Key Vault
  storage: vault

  # Ніколи не зберігати в:
  never_store_in:
    - source_code          # Ніколи в коді
    - version_control      # Ніколи в Git
    - environment_files    # Обережно з .env файлами
    - configuration_files  # Не в конфігах у відкритому вигляді
    - logs                 # Не логувати секрети

  # Ротація секретів
  rotation:
    enabled: true
    schedule: "90d"        # Кожні 90 днів
    
    # Автоматична ротація для:
    auto_rotate:
      - jwt_secrets
      - encryption_keys
      - database_passwords
      - api_keys


# ───────────────────────────────────────────────────────────────────────────────
# 6. АУДИТ та МОНІТОРИНГ
# ───────────────────────────────────────────────────────────────────────────────
audit:
  # Логування криптографічних операцій
  # Чому важливо:
  # - Виявлення аномалій та атак
  # - Compliance (GDPR, HIPAA, SOC 2)
  # - Forensics при інцидентах
  crypto_operations_logging: true

  # Що логувати:
  log_events:
    - key_generation       # Генерація ключів
    - key_rotation         # Ротація ключів
    - encryption           # Операції шифрування (без даних!)
    - decryption           # Операції розшифрування
    - failed_verifications # Невдалі перевірки підписів
    - token_generation     # Генерація токенів
    - token_validation     # Валідація токенів

  # Алерти на підозрілу активність
  alerts:
    - multiple_failed_auth      # Багато невдалих спроб автентифікації
    - token_replay_detected     # Виявлено повторне використання токену
    - encryption_failures       # Помилки шифрування
    - key_access_from_unknown   # Доступ до ключів з незнайомих джерел


